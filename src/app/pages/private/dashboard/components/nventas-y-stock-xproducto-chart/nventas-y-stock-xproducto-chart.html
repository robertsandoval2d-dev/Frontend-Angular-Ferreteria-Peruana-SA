<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 rounded-4">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg font-semibold text-gray-800">Relación Ventas vs. Stock</h3>
    <span class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">Análisis de Dispersión de los últimos 3 meses</span>
  </div>

  <div id="chart-scatter" class="w-full">
    <apx-chart
      [series]="chartOptions.series!"
      [chart]="chartOptions.chart!"
      [xaxis]="chartOptions.xaxis!"
      [yaxis]="chartOptions.yaxis!"
      [dataLabels]="chartOptions.dataLabels!"
      [markers]="chartOptions.markers!"
      [tooltip]="chartOptions.tooltip!"
      [colors]="chartOptions.colors!" 
      [legend]="chartOptions.legend!">
    </apx-chart>
  </div>
</div>
