<div class="form-update-usuario d-flex flex-column px-4 py-3 rounded">
    <div class="d-flex flex-row w-100 justify-content-between align-items-center gap-5 mb-2">
        <p class="fs-3 fw-bold text start m-0">Actualizar Trabajador</p>
        <button type="button" class="btn-close" style="font-size: 14px;" aria-label="Close" (click)="cancelarUpdate()"></button>
    </div>
    <form [formGroup]="updateForm" (ngSubmit)="updateUsuario()" class="my-1">
        <div class="mb-3">
            <label for="updatename" class="form-label">Nombre: </label>
            <input type="text" class="form-control" id="updatename" formControlName="nombre">
        </div>
        <div class="mb-3">
            <label for="updatedni" class="form-label">Dni</label>
            <input type="text" class="form-control" id="updatedni" formControlName="dni">
        </div>
        @if (trabajador?.rol !== 'ADMIN') {
            <div class="mb-3">
                <label for="updateidtienda" class="form-label">ID de Tienda</label>
                <select id="updateidtienda" class="form-select" formControlName="tiendaId">
                    @if (trabajador.tiendaId !== null) {
                        <option [ngValue]="trabajador.tiendaId">{{ trabajador.nombreTienda }}</option>
                    }@else {
                        <option value="" disabled>Trabajador sin tienda...</option>
                    }
                    @for (sucursal of listaSucursales; track sucursal.tiendaId) {
                        <option [ngValue]="sucursal.tiendaId">{{ sucursal.nombreTienda }}</option>
                    }
                </select>
            </div>
        }
        
        @if (trabajador?.rol === 'JEFE_DE_LINEA') {
            <div class="mb-3">
                <label for="updateidlinea" class="form-label">ID de Línea</label>
                <select id="updateidlinea" class="form-select" formControlName="lineaId">
                    @if (updateForm.get('tiendaId')?.value === trabajador?.tiendaId && trabajador?.lineaId !== null) {
                        <option [ngValue]="trabajador.lineaId">{{ trabajador.lineaId }}</option>
                    } @else {
                        <option value="" disabled selected>Seleccione una línea...</option>
                    }
                    @for (linea of listaLineas; track linea.lineaId) {
                        <option [ngValue]="linea.lineaId">{{ linea.nombreLinea }}</option>
                    }
                </select>        
            </div>
        }


        
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
