<div class="form-registro-usuario rounded-3 overflow-hidden px-4 py-4">
    <div class="form-header d-flex flex-row w-100 justify-content-between mt-0 mb-3 align-items-center px-2">
        <p class="fs-4 fw-bold m-0">Registrar Nuevo Trabajador</p>
        <button type="button" class="btn-close" style="font-size: 14px;" aria-label="Close" (click)="cancelarRegistro()"></button>
    </div>
    <form [formGroup]="registroForm" (ngSubmit)="guardarUsuario()" class="row g-3 px-1 py-1">
        <div class="col-12">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="name" formControlName="nombre">
        </div>
        <div class="col-12">
            <label for="dni" class="form-label">Dni</label>
            <input type="text" class="form-control" id="dni" formControlName="dni">
        </div>
        <div class="col-12">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" formControlName="username">
        </div>
        <div class="col-12">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" formControlName="password">
        </div>
        <div class="col-md-4">
            <label for="rol" class="form-label">Rol</label>
            <select id="rol" class="form-select" formControlName="rol">
                <option value="" disabled selected>Selecciona un rol...</option>
                <option value="JEFE_DE_LINEA">Jefe de Línea</option>
                <option value="ALMACENERO">Almacenero</option>
                <option value="ADMINISTRADOR_DE_TIENDA">Administrador de Tienda</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
        @if (registroForm.get('rol')?.value !== 'ADMIN' && registroForm.get('rol')?.value !== '') {
            <div class="col-md-4">
                <label for="store" class="form-label">Tienda</label>
                <select id="store" class="form-select" formControlName="tiendaId">
                    <option value="" disabled selected>Seleccione...</option>
                    @for (sucursal of listaSucursales; track sucursal.tiendaId) {
                        <option [value]="sucursal.tiendaId">{{sucursal.nombreTienda}}⠀</option>
                    }

                </select>
            </div>
        }

        @if (registroForm.get('rol')?.value === 'JEFE_DE_LINEA') {
            <div class="col-md-4">
                <label for="line" class="form-label">Línea</label>
                <select id="line" class="form-select was" formControlName="lineaId">
                    <option value="" disabled selected>Seleccione...</option>
                        @for (linea of listaLineas; track linea.lineaId) {
                            <option [value]="linea.lineaId">{{linea.nombreLinea}}⠀</option>
                        }
                </select>
            </div>
        }

        <div class="col-12 mt-4">
            <button type="submit" class="btn-registrar btn fw-bolder">Registrar</button>
        </div>
    </form>
</div>
