<div class="tabla-usuarios rounded-3 overflow-hidden shadow-sm">
  <div class="table-usuarios-head d-flex flex-column flex-lg-row align-items-md-center gap-2 px-3 px-lg-4 py-2 py-md-2 py-lg-0.5">
    <div class="w-100">
      <p class="table-name m-0 text-center text-lg-start">Lista de Trabajadores</p>
    </div>
    <div class="d-flex flex-column flex-md-row flex-end gap-2 gap-md-3 justify-content-end w-100">
      <button class="btn-filtrar btn w-100 fw-bolder">Filtrar</button>
      <button class="btn-registrar btn w-100 w-md-auto fw-bolder" (click)="abrirRegistro()">Registrar Nuevo Trabajador</button>
    </div>
  </div>
  
  <table class="table table-striped m-0">
    <thead>
      <tr class="">
        <th scope="col" class="th-id">ID</th>
        <th scope="col" class="th-rol">Rol</th>
        <th scope="col" class="th-user">Usuario</th>
        <th scope="col" class="th-name">Nombre</th>
        <th scope="col" class="th-dni">DNI</th>
        <th scope="col" class="th-options"></th>
      </tr>
    </thead>
    <tbody class="table-group-divider">
      @for (trabajador of listaTrabajadores; track trabajador.trabajadorId){
        <tr>
          <td scope="row" class="th-id">#{{trabajador.trabajadorId}}</td>
          <td class="">{{trabajador.rol}}</td>
          <td class="">{{trabajador.username}}</td>
          <td class="">{{trabajador.nombre}}</td>
          <td class="th-dni">{{trabajador.dni}}</td>
          <td class="th-options">
            <div class="dropdown align-items-center text-center">
              <button class="btn-dots btn p-0" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-three-dots-vertical"></i>
              </button>
              <ul class="dropdown-menu">
                <li>
                  <button class="dropdown-item text-center">
                    <p class="m-0" (click)="modificarTrabajador(trabajador)">Modificar</p>
                  </button>
                </li>
                <li>
                  <button class="dropdown-item text-center ">
                    <p class="m-0">Eliminar</p>
                  </button>
                </li>
              </ul>
            </div>
          </td>
        </tr>
      }
      <tr>
        <td scope="row" class="">11111</td>
        <td class="">rol</td>
        <td class="">username</td>
        <td class="">nombre</td>
        <td class="">123456789</td>
        <td class="th-options">
          <div class="dropdown align-items-center text-center">
            <button class="btn-dots btn p-0" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-three-dots-vertical"></i>
            </button>
            <ul class="dropdown-menu">
              <li>
                <button class="dropdown-item text-center">
                  <p class="m-0" (click)="modificarTrabajador(trabajadorDePrueba)">Modificar</p>
                </button>
              </li>
              <li>
                <button class="dropdown-item text-center ">
                  <p class="m-0">Eliminar</p>
                </button>
              </li>
            </ul>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
