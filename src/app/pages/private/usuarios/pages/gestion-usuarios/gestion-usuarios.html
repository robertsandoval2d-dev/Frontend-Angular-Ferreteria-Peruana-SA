<div class="p-4 d-flex flex-column align-items-center">
    <app-tabla-usuarios (onRegistrarClick)="mostrarFormulario = true"></app-tabla-usuarios>

    @if (mostrarFormulario) {
        <div class="overlay-modal d-flex justify-content-center align-items-center">
            <app-form-registro-usuario (onCancelar)="cerrarFormulario()"></app-form-registro-usuario>
        </div>
    }
</div>
