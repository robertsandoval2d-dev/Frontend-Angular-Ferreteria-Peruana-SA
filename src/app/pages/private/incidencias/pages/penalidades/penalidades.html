<app-tabla-ordenes-compra-penalidad (onAbrir)="abrirFormulario($event)"></app-tabla-ordenes-compra-penalidad>
@if(mostrarFormulario){
    <div class="overlay-modal d-flex justify-content-center align-items-center"> 
        <app-form-registro-penalidad 
            [ordenVencida] = "ordenSeleccionada" 
            (onCerrar)="cerrarFormulario()">
        </app-form-registro-penalidad>
    </div>
}
