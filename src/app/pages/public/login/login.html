<div class="login-bg">

  <div class="card p-4 shadow">
        <h4 class="text-center mb-3">Iniciar Sesión con tus credenciales</h4>
        <form [formGroup]="form" (ngSubmit)="iniciarSesion()">
        <div class="mb-3">
            <label for="username" class="form-label">Usario</label>
            <input type="text" name="username" class="form-control"  id="username" placeholder="Escribe tu nombre de usuario" formControlName="username">
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" id="password" placeholder="Escribe tu contraseña" formControlName="password">
        </div>
        <button type="submit" class="btn btn-primary mb-3">Iniciar Sesión</button>
        <label class="form-label-recover-pwd">¿Olvidaste tu contraseña?</label>
        </form>
  </div>

</div>
